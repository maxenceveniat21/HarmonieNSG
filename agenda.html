<!DOCTYPE html>
<html lang="fr">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XFFFR3DDJY"></script>
  <meta charset="UTF-8"/>
  <meta name="description" content="Retrouvez tous les prochains concerts et animations de l'Harmonie de Nuits-Saint-Georges en 2026 : concerts de printemps, fête de la musique, cérémonies du 8 Mai. Entrée libre.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agenda & Concerts — Harmonie de Nuits-Saint-Georges 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="agenda.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- Open Graph / Réseaux sociaux -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.harmonie-nuits-saint-georges.fr/agenda.html">
  <meta property="og:title" content="Agenda & Concerts — Harmonie de Nuits-Saint-Georges 2026">
  <meta property="og:description" content="Retrouvez tous les prochains concerts et animations de l'Harmonie de Nuits-Saint-Georges en 2026 : concerts de printemps, fête de la musique, cérémonies du 8 Mai. Entrée libre.">
  <meta property="og:image" content="images/Affiche Concert Printemps 2026.jpg">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Harmonie de Nuits-Saint-Georges">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Agenda & Concerts — Harmonie de Nuits-Saint-Georges 2026">
  <meta name="twitter:description" content="Retrouvez tous les prochains concerts et animations de l'Harmonie de Nuits-Saint-Georges en 2026 : concerts de printemps, fête de la musique, cérémonies du 8 Mai. Entrée libre.">
  <meta name="twitter:image" content="images/Affiche Concert Printemps 2026.jpg">
</head>
<body>

  <div class="page-hero">
    <p class="page-hero-tag">Nos rendez-vous</p>
    <h1><em>Agenda<br>&amp; Événements</em></h1>
  </div>

  <section class="section">
    <p class="section-tag">Concerts à venir</p>
    <h2>Prochains concerts</h2>
    <div class="section-line"></div>

    <div class="carousel-wrapper">
      <button class="carousel-arrow carousel-arrow--prev" id="concertsPrev" aria-label="Précédent">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10L13 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="carousel-track-wrapper">
        <!-- Cartes générées automatiquement par script.js selon la date du jour -->
        <div class="carousel-track" id="concertsTrack"></div>
      </div>
      <button class="carousel-arrow carousel-arrow--next" id="concertsNext" aria-label="Suivant">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7 4L13 10L7 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="map-container" id="mapConcerts">
      <div class="map-header">
        <span class="map-lieu-label" id="mapLieuConcerts">Sélectionnez un concert</span>
        <button class="map-close" data-target="mapConcerts" aria-label="Fermer">✕</button>
      </div>
      <div class="map-itinerary">
        <input class="map-input" id="inputConcerts" type="text" placeholder="Votre adresse de départ…"/>
        <button class="map-itinerary-btn" id="btnItineraryConcerts">🗺 Calculer l'itinéraire</button>
      </div>
      <div id="mapConcertsLeaflet"></div>
    </div>

    <div class="agenda-subsection">
      <p class="section-tag">Animations</p>
      <h2>Animations de l'année</h2>
      <div class="section-line"></div>

      <div class="carousel-wrapper">
        <button class="carousel-arrow carousel-arrow--prev" id="animsPrev" aria-label="Précédent">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10L13 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="carousel-track-wrapper">
          <!-- Cartes générées automatiquement par script.js selon la date du jour -->
          <div class="carousel-track" id="animsTrack"></div>
        </div>
        <button class="carousel-arrow carousel-arrow--next" id="animsNext" aria-label="Suivant">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7 4L13 10L7 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="map-container" id="mapAnims">
        <div class="map-header">
          <span class="map-lieu-label" id="mapLieuAnims">Sélectionnez une animation</span>
          <button class="map-close" data-target="mapAnims" aria-label="Fermer">✕</button>
        </div>
        <div class="map-itinerary">
          <input class="map-input" id="inputAnims" type="text" placeholder="Votre adresse de départ…"/>
          <button class="map-itinerary-btn" id="btnItineraryAnims">🗺 Calculer l'itinéraire</button>
        </div>
        <div id="mapAnimsLeaflet"></div>
      </div>
    </div>
  </section>

  <!-- LIGHTBOX AFFICHE -->
  <div class="lightbox" id="eventLightbox">
    <button class="lightbox-close" id="eventLightboxClose" aria-label="Fermer">✕</button>
    <div class="lightbox-img-wrap"><img class="lightbox-img" id="eventLightboxImg" src="" alt=""></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
